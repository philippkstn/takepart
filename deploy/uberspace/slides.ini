; supervisord-Dienst für TakePart (Uberspace 7)
; Installiert von setup.sh nach ~/etc/services.d/slides.ini
; Ein Prozess liefert Web-App, API und WebSockets aus; die Konfiguration kommt aus ~/slides/shared/.env.
[program:slides]
directory=%(ENV_HOME)s/slides/current/server
command=node --env-file=%(ENV_HOME)s/slides/shared/.env server.mjs
autostart=yes
autorestart=yes
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=15
